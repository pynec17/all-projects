<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Index of Projects</title>
  <meta name="description" content="A running list of things I've built." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,700;1,500&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:       #f6f1e7;
      --surface:  #fffdf8;
      --border:   #e2d8c3;
      --text:     #221d16;
      --muted:    #8b8171;
      --accent:   #cf5628;
      --accent-hi:#a8451f;
      --mono:    "IBM Plex Mono", ui-monospace, Menlo, monospace;
      --display: "Fraunces", Georgia, serif;
      --sans:    system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      line-height: 1.5;
      background-image:
        radial-gradient(90% 60% at 8% -10%, rgba(207,86,40,0.08), transparent 55%);
      background-attachment: fixed;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: clamp(2.5rem, 8vw, 5.5rem) 1.25rem 4rem;
    }

    /* ---- header ---- */
    .eyebrow {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--accent);
      margin: 0 0 1.1rem;
      font-weight: 600;
    }
    h1 {
      font-family: var(--display);
      font-weight: 700;
      font-style: italic;
      font-size: clamp(2.2rem, 7vw, 3.6rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
      margin: 0 0 0.9rem;
    }
    .lede {
      color: var(--muted);
      max-width: 50ch;
      margin: 0;
      font-size: 1.04rem;
    }
    .count {
      font-family: var(--mono);
      font-size: 0.76rem;
      color: var(--muted);
      letter-spacing: 0.06em;
      margin: 2.25rem 0 0;
    }
    .count b { color: var(--text); font-weight: 600; }

    /* ---- card grid ---- */
    .index {
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1rem;
      margin: 1rem 0 0;
      padding: 0;
    }
    .entry {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.4rem 1.3rem 1.3rem;
      color: inherit;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }
    .entry:hover, .entry:focus-visible {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 10px 24px -12px rgba(34, 29, 22, 0.25);
      outline: none;
    }

    .entry__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
    }
    .entry__num {
      font-family: var(--mono);
      font-size: 0.72rem;
      color: var(--muted);
    }

    .entry__title {
      font-family: var(--display);
      font-weight: 700;
      font-size: 1.28rem;
      color: var(--text);
      margin: 0.55rem 0 0;
    }
    .entry:hover .entry__title, .entry:focus-visible .entry__title { color: var(--accent-hi); }

    .entry__meta {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.7rem;
    }
    .tag {
      font-family: var(--mono);
      font-size: 0.64rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-hi);
      background: rgba(207,86,40,0.09);
      border-radius: 999px;
      padding: 0.18rem 0.6rem;
    }
    .year { font-family: var(--mono); font-size: 0.72rem; color: var(--muted); }

    .entry__desc {
      color: var(--muted);
      font-size: 0.92rem;
      margin: 0.65rem 0 0;
    }

    /* ---- empty state ---- */
    .empty {
      grid-column: 1 / -1;
      padding: 2.75rem 1.5rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border);
      border-radius: 14px;
    }
    .empty code {
      font-family: var(--mono);
      color: var(--accent-hi);
      background: var(--surface);
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
    }

    footer {
      max-width: 900px;
      margin: 0 auto;
      padding: 0 1.25rem 3rem;
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.05em;
      color: var(--muted);
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <p class="eyebrow">Projects · Index</p>
    <h1>Things I've built</h1>
    <p class="lede">A running list of small tools, games, and experiments. Newest first — pick one and have a look.</p>

    <ul class="index" id="index"></ul>
    <p class="count" id="count"></p>
  </main>

  <footer>
    <span id="year"></span> · built for fun
  </footer>

  <!-- The list of projects lives in projects.js as window.PROJECTS. Add one there. -->
  <script src="projects.js"></script>
  <script>
    (function () {
      var list = document.getElementById("index");
      var count = document.getElementById("count");
      document.getElementById("year").textContent = new Date().getFullYear();

      var items = Array.isArray(window.PROJECTS) ? window.PROJECTS.slice() : [];

      // Newest first when an "added" date is present; otherwise keep file order.
      items.sort(function (a, b) {
        if (a.added && b.added) return a.added < b.added ? 1 : a.added > b.added ? -1 : 0;
        return 0;
      });

      if (items.length === 0) {
        list.innerHTML =
          '<li class="empty">No projects yet. Add your first one to <code>projects.js</code>.</li>';
        count.textContent = "";
        return;
      }

      items.forEach(function (p, i) {
        var num = String(i + 1).padStart(2, "0");
        var href = p.href || "./" + p.slug + "/";
        var year = p.added ? String(p.added).slice(0, 4) : "";

        var a = document.createElement("a");
        a.className = "entry";
        a.href = href;
        a.innerHTML =
          '<span class="entry__top">' +
            '<span class="entry__num">' + num + "</span>" +
            (year ? '<span class="year">' + year + "</span>" : "") +
          "</span>" +
          '<span class="entry__title"></span>' +
          '<span class="entry__meta">' +
            (p.type ? '<span class="tag"></span>' : "") +
          "</span>" +
          '<span class="entry__desc"></span>';

        // Set user text with textContent so it can't inject markup.
        a.querySelector(".entry__title").textContent = p.title || p.slug || "Untitled";
        a.querySelector(".entry__desc").textContent = p.description || "";
        if (p.type) a.querySelector(".tag").textContent = p.type;

        var li = document.createElement("li");
        li.appendChild(a);
        list.appendChild(li);
      });

      count.innerHTML = "<b>" + items.length + "</b> " + (items.length === 1 ? "project" : "projects");
    })();
  </script>
</body>
</html>
