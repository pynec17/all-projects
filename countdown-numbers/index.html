<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Countdown Numbers</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back" href="../">&#9664; INDEX</a>
  <h1>Countdown Numbers</h1>
  <p class="sub">Combine six numbers to reach the target.</p>

  <div class="panel">
    <div id="setup">
      <button id="start-btn">DRAW NUMBERS</button>
    </div>

    <div id="game">
      <div class="target-wrap">
        <span class="target-label">TARGET</span>
        <div class="target" id="target"></div>
      </div>

      <div class="tiles" id="tiles"></div>

      <div class="ops" id="ops">
        <div class="op" data-op="+">+</div>
        <div class="op" data-op="-">&minus;</div>
        <div class="op" data-op="*">&times;</div>
        <div class="op" data-op="/">&divide;</div>
      </div>

      <div class="controls">
        <button id="undo-btn">UNDO</button>
        <button id="reset-btn">RESET</button>
        <button id="submit-btn" class="primary">SUBMIT</button>
      </div>

      <div class="log" id="log"></div>
      <div class="result" id="result"></div>

      <div class="controls">
        <button id="new-btn">NEW GAME</button>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
