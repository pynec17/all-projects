<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>React Questions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a class="back" href="../">&#9664; INDEX</a>
  <h1>React Questions</h1>
  <p class="sub">Small React challenges. Write the component, hit Run, and a few automated checks tell you if it behaves correctly — no setup, it all runs live in your browser.</p>
</header>

<main>
  <nav class="question-list" id="question-list"></nav>

  <section class="workspace">
    <span class="difficulty-tag" id="q-difficulty"></span>
    <h2 id="q-title"></h2>
    <div class="prompt" id="q-prompt"></div>

    <div class="panes">
      <div>
        <div class="pane-label">Your code</div>
        <textarea id="editor" spellcheck="false" autocapitalize="off" autocomplete="off"></textarea>
      </div>
      <div>
        <div class="pane-label">Preview</div>
        <div class="preview-frame-wrap">
          <iframe id="preview" title="React preview" sandbox="allow-scripts allow-same-origin"></iframe>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn primary" id="run-btn">Run &amp; Test</button>
      <button class="btn" id="reset-btn">Reset</button>
      <button class="btn" id="solution-btn">Show Solution</button>
    </div>

    <div class="results" id="results" hidden>
      <h3>Test results</h3>
      <ul class="result-list" id="result-list"></ul>
    </div>

    <div class="solution" id="solution-block" hidden>
      <div class="pane-label">Solution</div>
      <pre id="solution-code"></pre>
      <div class="controls">
        <button class="btn" id="load-solution-btn">Load into editor</button>
      </div>
    </div>
  </section>
</main>

<script src="script.js"></script>
</body>
</html>
