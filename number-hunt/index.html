<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Hunt</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back" href="../">&#9664; INDEX</a>
  <h1>Number Hunt</h1>
  <p class="sub">I'm thinking of a number from 1 to 100.</p>

  <div>
    <input id="guess" type="number" min="1" max="100" inputmode="numeric" autofocus />
    <button id="go">GUESS</button>
  </div>
  <div class="msg" id="msg">Take a guess.</div>
  <div class="tries" id="tries"></div>

  <script src="script.js"></script>
</body>
</html>
