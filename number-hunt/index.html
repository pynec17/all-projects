<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Number Hunt</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#14161c; --surface:#1b1e26; --border:#2b2f3a;
      --text:#eceef2; --muted:#828997; --accent:#8b95ff; --accent-hi:#aeb5ff; --win:#7dd6a8;
      --mono:"Space Mono", ui-monospace, Menlo, monospace;
      --display:"Space Grotesk", system-ui, sans-serif;
      --sans:system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family:var(--sans); display:flex; flex-direction:column;
      align-items:center; justify-content:center; padding:1.5rem; text-align:center;
    }
    .back {
      position:fixed; top:1.1rem; left:1.25rem; font-family:var(--mono);
      font-size:0.72rem; letter-spacing:0.14em; color:var(--muted); text-decoration:none;
    }
    .back:hover { color:var(--accent); }
    h1 { font-family:var(--display); font-weight:700; font-size:clamp(1.9rem,6vw,2.7rem); margin:0 0 0.4rem; }
    p.sub { color:var(--muted); margin:0 0 2rem; }
    input {
      font-family:var(--mono); font-size:1.4rem; width:6.5rem; text-align:center;
      padding:0.6rem; background:var(--surface); border:1px solid var(--border);
      border-radius:8px; color:var(--text); outline:none;
    }
    input:focus { border-color:var(--accent); }
    button {
      font-family:var(--mono); font-weight:700; font-size:1rem; letter-spacing:0.08em;
      margin-left:0.6rem; padding:0.7rem 1.3rem; background:var(--accent); color:#0e1017;
      border:none; border-radius:8px; cursor:pointer;
    }
    button:hover { background:var(--accent-hi); }
    .msg { font-family:var(--mono); margin-top:1.6rem; min-height:1.5rem; font-size:1.05rem; }
    .msg.hot { color:var(--accent-hi); }
    .msg.win { color:var(--win); }
    .tries { color:var(--muted); font-family:var(--mono); font-size:0.8rem; margin-top:0.6rem; }
  </style>
</head>
<body>
  <a class="back" href="../">&#9664; INDEX</a>
  <h1>Number Hunt</h1>
  <p class="sub">I'm thinking of a number from 1 to 100.</p>

  <div>
    <input id="guess" type="number" min="1" max="100" inputmode="numeric" autofocus />
    <button id="go">GUESS</button>
  </div>
  <div class="msg" id="msg">Take a guess.</div>
  <div class="tries" id="tries"></div>

  <script>
    var target = Math.floor(Math.random() * 100) + 1;
    var tries = 0;
    var input = document.getElementById("guess");
    var msg = document.getElementById("msg");
    var triesEl = document.getElementById("tries");

    function guess() {
      var v = parseInt(input.value, 10);
      if (isNaN(v) || v < 1 || v > 100) { msg.className = "msg"; msg.textContent = "Enter 1\u2013100."; return; }
      tries++;
      triesEl.textContent = tries + (tries === 1 ? " guess" : " guesses");
      if (v === target) {
        msg.className = "msg win";
        msg.textContent = "Got it in " + tries + "! Refresh to play again.";
      } else if (v < target) {
        msg.className = "msg hot"; msg.textContent = "Higher \u2191";
      } else {
        msg.className = "msg hot"; msg.textContent = "Lower \u2193";
      }
      input.select();
    }
    document.getElementById("go").addEventListener("click", guess);
    input.addEventListener("keydown", function (e) { if (e.key === "Enter") guess(); });
  </script>
</body>
</html>
