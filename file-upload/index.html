<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Upload</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#f6f1e7; --surface:#fffdf8; --border:#e4dbc9;
      --text:#221d16; --muted:#8b8171; --accent:#cf5628; --accent-hi:#b3461f;
      --serif:"Fraunces", Georgia, serif;
      --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
      --sans:-apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing:border-box; }
    body {
      margin:0; min-height:100vh; background:var(--bg); color:var(--text);
      font-family:var(--sans); display:flex; flex-direction:column;
      align-items:center; padding:4.5rem 1.25rem 3rem;
    }
    .back {
      position:fixed; top:1.1rem; left:1.25rem; font-family:var(--mono);
      font-size:0.72rem; letter-spacing:0.08em; color:var(--muted); text-decoration:none;
    }
    .back:hover { color:var(--accent); }

    h1 {
      font-family:var(--serif); font-style:italic; font-weight:600;
      font-size:clamp(1.9rem,5.5vw,2.5rem); margin:0 0 0.4rem; text-align:center;
    }
    p.sub { color:var(--muted); margin:0 0 2.25rem; text-align:center; max-width:32rem; }

    .card {
      width:100%; max-width:34rem; background:var(--surface);
      border:1px solid var(--border); border-radius:14px;
      padding:1.5rem; box-shadow:0 1px 2px rgba(34,29,22,0.04);
    }

    .dropzone {
      border:2px dashed var(--border); border-radius:10px;
      padding:2.5rem 1.5rem; text-align:center; cursor:pointer;
      transition:border-color 0.15s ease, background-color 0.15s ease;
    }
    .dropzone:hover { border-color:var(--accent); }
    .dropzone.drag { border-color:var(--accent); background:#fbf3ec; }
    .dropzone .icon { font-size:2rem; margin-bottom:0.6rem; }
    .dropzone .prompt { font-family:var(--mono); font-size:0.85rem; }
    .dropzone .prompt .browse { color:var(--accent); text-decoration:underline; }
    .dropzone .hint { color:var(--muted); font-size:0.78rem; margin-top:0.5rem; }
    input[type="file"] { display:none; }

    .file-info {
      display:none; align-items:center; gap:0.9rem;
      border:1px solid var(--border); border-radius:10px; padding:1rem 1.1rem;
    }
    .file-info.show { display:flex; }
    .file-info .glyph {
      width:2.6rem; height:2.6rem; flex:none; border-radius:8px;
      background:#fbf3ec; color:var(--accent); font-family:var(--mono);
      font-size:0.62rem; font-weight:600; letter-spacing:0.02em;
      display:flex; align-items:center; justify-content:center; text-align:center;
    }
    .file-info .meta { min-width:0; flex:1; }
    .file-info .name {
      font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .file-info .detail { font-family:var(--mono); font-size:0.76rem; color:var(--muted); margin-top:0.2rem; }
    .file-info .remove {
      flex:none; background:none; border:none; color:var(--muted);
      font-family:var(--mono); font-size:1.1rem; cursor:pointer; line-height:1; padding:0.3rem;
    }
    .file-info .remove:hover { color:var(--accent); }

    .preview { margin-top:1rem; display:none; }
    .preview.show { display:block; }
    .preview img { display:block; width:100%; max-height:20rem; object-fit:contain; border-radius:8px; border:1px solid var(--border); }
    .preview embed { width:100%; height:22rem; border-radius:8px; border:1px solid var(--border); }

    .next {
      margin-top:1.25rem; display:none; align-items:center; justify-content:space-between;
      gap:1rem; border-top:1px solid var(--border); padding-top:1.1rem;
    }
    .next.show { display:flex; }
    .next .label { font-family:var(--mono); font-size:0.76rem; color:var(--muted); }
    .next button {
      font-family:var(--mono); font-weight:600; font-size:0.8rem; letter-spacing:0.03em;
      padding:0.55rem 1.1rem; background:var(--border); color:var(--muted);
      border:none; border-radius:8px; cursor:not-allowed;
    }
  </style>
</head>
<body>
  <a class="back" href="../">&#9664; INDEX</a>
  <h1>File Upload</h1>
  <p class="sub">Browse or drop a file to load it into the page. Nothing leaves your browser yet &mdash; processing comes next.</p>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <div class="icon">&#128193;</div>
      <div class="prompt">Drop a file here or <span class="browse">browse</span></div>
      <div class="hint">PDF, image, text &mdash; any file type</div>
    </div>
    <input type="file" id="fileInput" />

    <div class="file-info" id="fileInfo">
      <div class="glyph" id="fileGlyph">FILE</div>
      <div class="meta">
        <div class="name" id="fileName"></div>
        <div class="detail" id="fileDetail"></div>
      </div>
      <button class="remove" id="removeFile" title="Remove file">&times;</button>
    </div>

    <div class="preview" id="preview"></div>

    <div class="next" id="next">
      <div class="label">File held in memory, ready for processing.</div>
      <button id="processBtn" disabled>PROCESS &rarr;</button>
    </div>
  </div>

  <script>
    // The loaded file lives here for whatever comes next (e.g. sending to an LLM).
    var state = { file: null, previewUrl: null };

    var dropzone = document.getElementById("dropzone");
    var fileInput = document.getElementById("fileInput");
    var fileInfo = document.getElementById("fileInfo");
    var fileGlyph = document.getElementById("fileGlyph");
    var fileName = document.getElementById("fileName");
    var fileDetail = document.getElementById("fileDetail");
    var removeFile = document.getElementById("removeFile");
    var preview = document.getElementById("preview");
    var next = document.getElementById("next");
    var processBtn = document.getElementById("processBtn");

    function formatSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + " KB";
      return (bytes / (1024 * 1024)).toFixed(1) + " MB";
    }

    function extGlyph(name) {
      var m = /\.([a-z0-9]+)$/i.exec(name || "");
      return m ? m[1].toUpperCase().slice(0, 4) : "FILE";
    }

    function loadFile(file) {
      if (!file) return;
      state.file = file;

      fileGlyph.textContent = extGlyph(file.name);
      fileName.textContent = file.name;
      fileDetail.textContent = formatSize(file.size) + (file.type ? " · " + file.type : "");
      fileInfo.classList.add("show");

      if (state.previewUrl) {
        URL.revokeObjectURL(state.previewUrl);
        state.previewUrl = null;
      }
      preview.innerHTML = "";
      preview.classList.remove("show");

      if (file.type.indexOf("image/") === 0) {
        state.previewUrl = URL.createObjectURL(file);
        var img = document.createElement("img");
        img.src = state.previewUrl;
        preview.appendChild(img);
        preview.classList.add("show");
      } else if (file.type === "application/pdf") {
        state.previewUrl = URL.createObjectURL(file);
        var embed = document.createElement("embed");
        embed.src = state.previewUrl;
        embed.type = "application/pdf";
        preview.appendChild(embed);
        preview.classList.add("show");
      }

      next.classList.add("show");
      dropzone.style.display = "none";
    }

    function clearFile() {
      state.file = null;
      if (state.previewUrl) {
        URL.revokeObjectURL(state.previewUrl);
        state.previewUrl = null;
      }
      fileInput.value = "";
      fileInfo.classList.remove("show");
      preview.innerHTML = "";
      preview.classList.remove("show");
      next.classList.remove("show");
      dropzone.style.display = "";
    }

    dropzone.addEventListener("click", function () { fileInput.click(); });
    fileInput.addEventListener("change", function () {
      if (fileInput.files && fileInput.files[0]) loadFile(fileInput.files[0]);
    });

    ["dragenter", "dragover"].forEach(function (evt) {
      dropzone.addEventListener(evt, function (e) {
        e.preventDefault();
        dropzone.classList.add("drag");
      });
    });
    ["dragleave", "dragend"].forEach(function (evt) {
      dropzone.addEventListener(evt, function (e) {
        e.preventDefault();
        dropzone.classList.remove("drag");
      });
    });
    dropzone.addEventListener("drop", function (e) {
      e.preventDefault();
      dropzone.classList.remove("drag");
      if (e.dataTransfer.files && e.dataTransfer.files[0]) loadFile(e.dataTransfer.files[0]);
    });

    removeFile.addEventListener("click", function (e) {
      e.stopPropagation();
      clearFile();
    });
  </script>
</body>
</html>
