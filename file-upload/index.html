<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>File Upload</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back" href="../">&#9664; INDEX</a>
  <h1>File Upload</h1>
  <p class="sub">Browse or drop a file to load it into the page. Nothing leaves your browser yet &mdash; processing comes next.</p>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <div class="icon">&#128193;</div>
      <div class="prompt">Drop a file here or <span class="browse">browse</span></div>
      <div class="hint">PDF, image, text &mdash; any file type</div>
    </div>
    <input type="file" id="fileInput" />

    <div class="file-info" id="fileInfo">
      <div class="glyph" id="fileGlyph">FILE</div>
      <div class="meta">
        <div class="name" id="fileName"></div>
        <div class="detail" id="fileDetail"></div>
      </div>
      <button class="remove" id="removeFile" title="Remove file">&times;</button>
    </div>

    <div class="preview" id="preview"></div>

    <div class="next" id="next">
      <div class="label">File held in memory, ready for processing.</div>
      <button id="processBtn" disabled>PROCESS &rarr;</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
