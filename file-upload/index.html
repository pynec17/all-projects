<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CV Screener</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <a class="back" href="../">&#9664; INDEX</a>
  <h1>CV Screener</h1>
  <p class="sub">Upload a CV and Claude screens it like a recruiter &mdash; the roles it fits, and what's missing for each.</p>

  <div class="card">
    <div class="dropzone" id="dropzone">
      <div class="icon">&#128193;</div>
      <div class="prompt">Drop your CV here or <span class="browse">browse</span></div>
      <div class="hint">PDF or Word (.docx)</div>
    </div>
    <input type="file" id="fileInput" accept=".pdf,.docx,application/pdf,application/vnd.openxmlformats-officedocument.wordprocessingml.document" />

    <div class="file-info" id="fileInfo">
      <div class="glyph" id="fileGlyph">FILE</div>
      <div class="meta">
        <div class="name" id="fileName"></div>
        <div class="detail" id="fileDetail"></div>
      </div>
      <button class="remove" id="removeFile" title="Remove file">&times;</button>
    </div>

    <div class="preview" id="preview"></div>

    <div class="next" id="next">
      <div class="label" id="nextLabel">File held in memory, ready to screen.</div>
      <button id="processBtn" disabled>SCREEN CV &rarr;</button>
    </div>

    <div class="analysis" id="analysis" hidden>
      <div class="analysis-label">Screening Report</div>
      <div class="analysis-text" id="analysisText"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.8.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
